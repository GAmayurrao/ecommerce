# ============================================================
# CI Build and Package
# ============================================================
# This workflow automatically runs on every push or pull
# request targeting the `growtharc` branch.
#
# What it does:
#   1. Checks out your source code
#   2. Installs Java 21 (matches pom.xml <java.version>)
#   3. Caches Maven dependencies (~/.m2) to speed up builds
#   4. Compiles the project and runs all unit tests
#   5. Builds the executable Spring Boot JAR
#   6. Uploads the JAR as a downloadable GitHub artifact
#   7. Runs Snyk security scan to detect vulnerable dependencies
# ============================================================

name: CI Build and Package

# ------------------------------------------------------------
# TRIGGER: When does this pipeline run?
# Runs on any push or pull_request targeting the growtharc branch
# ------------------------------------------------------------
on:
  push:
    branches:
      - growtharc
  pull_request:
    branches:
      - growtharc

# ------------------------------------------------------------
# JOBS: What machines and steps run?
# ------------------------------------------------------------
jobs:
  build:
    # Use the latest Ubuntu virtual machine hosted by GitHub (free)
    runs-on: ubuntu-latest

    # Pipeline will be marked FAILED if any step below fails
    # (this is the default behaviour — tests failing = pipeline fails)

    steps:

      # ----------------------------------------------------------
      # STEP 1: Check out the repository
      # Downloads your code from GitHub onto the runner machine
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # STEP 2: Set up Java 21
      # Installs the exact Java version your project uses.
      # temurin = Eclipse Adoptium (free, production-grade JDK)
      # ----------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ----------------------------------------------------------
      # STEP 3: Cache Maven dependencies
      # Saves the ~/.m2/repository folder between runs so Maven
      # does not re-download all JARs every single time.
      # Cache key changes only when pom.xml changes.
      # ----------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ----------------------------------------------------------
      # STEP 4: Compile and run all unit tests
      # `mvn clean verify` does the following in order:
      #   clean   → deletes old /target output
      #   compile → compiles all Java source files
      #   test    → runs all JUnit tests
      #   verify  → runs any post-test checks / integration tests
      #
      # If ANY test fails, this step fails and the pipeline stops.
      # The test profile uses H2 in-memory DB (no real PostgreSQL needed).
      # ----------------------------------------------------------
      - name: Run tests with Maven
        run: mvn clean verify --no-transfer-progress
        env:
          # Provide dummy Stripe key so StripeConfig loads without error
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci

      # ----------------------------------------------------------
      # STEP 5: Build the executable Spring Boot JAR
      # `mvn package -DskipTests` packages the already-tested code
      # into a single fat JAR that can be deployed anywhere.
      # We skip tests here because we already ran them in Step 4.
      # Output: target/ecommerce-0.0.1-SNAPSHOT.jar
      # ----------------------------------------------------------
      - name: Build Spring Boot JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci

      # ----------------------------------------------------------
      # STEP 6: Upload the JAR as a downloadable artifact
      # After the pipeline completes, you can go to:
      #   GitHub → Actions → This run → Artifacts → springboot-jar
      # and download the built JAR file directly.
      # The artifact is kept for 7 days.
      # ----------------------------------------------------------
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
          retention-days: 7

  # ============================================================
  # JOB 2: Snyk Security Scan
  # ============================================================
  # Runs AFTER the build job succeeds.
  # Uses the official Snyk GitHub Action to scan pom.xml and
  # all resolved dependencies for known CVEs.
  #
  # Requires a secret: SNYK_TOKEN
  # Set it in: GitHub → Repo Settings → Secrets and Variables
  #            → Actions → New repository secret → SNYK_TOKEN
  #
  # How to get your token:
  #   1. Log in at https://app.snyk.io
  #   2. Account Settings → Auth Token → copy the token
  # ============================================================
  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build          # only runs if the build job passes

    # Required so the SARIF upload to GitHub Security tab is allowed
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:

      # ----------------------------------------------------------
      # STEP 1: Check out code (Snyk needs pom.xml to be present)
      # ----------------------------------------------------------
      - name: Checkout source code
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # STEP 2: Set up Java 21
      # Snyk's Maven scan resolves the dependency tree, which
      # requires a valid JDK and Maven installation.
      # ----------------------------------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ----------------------------------------------------------
      # STEP 3: Cache Maven dependencies
      # Reuse the same cache from the build job to save time.
      # ----------------------------------------------------------
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # ----------------------------------------------------------
      # STEP 4: Run Snyk to scan for vulnerabilities
      # ----------------------------------------------------------
      # `snyk/actions/maven` is the official Snyk action for Maven
      # projects. It:
      #   • Resolves the full dependency tree via Maven
      #   • Checks every dependency against the Snyk vulnerability DB
      #   • Fails the step if vulnerabilities at or above the
      #     --severity-threshold are found
      #   • Uploads results as a SARIF report to GitHub Security tab
      #
      # --severity-threshold=high → only fail on HIGH or CRITICAL CVEs
      # (change to "critical" if you only want to block on CVSS ≥ 9)
      # ----------------------------------------------------------
      - name: Run Snyk vulnerability scan
        uses: snyk/actions/maven@master
        continue-on-error: true   # report findings but don't block the pipeline
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          # --sarif-file-output=snyk.sarif tells Snyk to write results
          # to a file so the next step can upload it to GitHub Security tab
          args: --severity-threshold=high --all-projects --sarif-file-output=snyk.sarif

      # ----------------------------------------------------------
      # STEP 5: Upload Snyk SARIF results to GitHub Security tab
      # After this runs, go to:
      #   GitHub → Security → Code scanning alerts
      # to view every CVE Snyk found, with severity and fix advice.
      # ----------------------------------------------------------
      - name: Upload Snyk SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()              # upload even if the scan step failed
        with:
          sarif_file: snyk.sarif
