name: CI Build and Package
on:
  push:
    branches:
      - growtharc
  pull_request:
    branches:
      - growtharc
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run tests with Maven
        run: mvn clean verify --no-transfer-progress
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Build Spring Boot JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
          retention-days: 7
  # ── Docker: Build & Push to GitHub Container Registry ──────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build                   # only runs after the build job passes
    # Only push on real commits (not on pull-request events)
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write              # needed to push to GHCR

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry using the auto-provided GITHUB_TOKEN
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags + labels) automatically from git context
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      # Build the multi-stage Dockerfile and push to GHCR
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Pre-fetch dependencies
        run: mvn dependency:resolve --no-transfer-progress -q
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Make mvnw executable
        run: chmod +x ./mvnw

      # Run Snyk using the official Maven action — handles Java/Maven correctly
      - name: Run Snyk vulnerability scan
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
        with:
          args: --severity-threshold=high --sarif-file-output=snyk.sarif

      # Validate SARIF has content before uploading (prevents "0 items" API error)
      - name: Verify SARIF file
        id: check_sarif
        if: always()
        run: |
          if [ -f snyk.sarif ] && [ -s snyk.sarif ]; then
            RUNS=$(python3 -c "import json; d=json.load(open('snyk.sarif')); print(len(d.get('runs',[])))")
            echo "Runs in SARIF: $RUNS"
            if [ "$RUNS" -gt "0" ]; then
              echo "sarif_valid=true" >> $GITHUB_OUTPUT
            else
              echo "sarif_valid=false" >> $GITHUB_OUTPUT
              echo "SARIF has 0 runs - skipping upload"
            fi
          else
            echo "sarif_valid=false" >> $GITHUB_OUTPUT
            echo "SARIF file missing or empty"
          fi

      - name: Upload Snyk SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.check_sarif.outputs.sarif_valid == 'true'
        with:
          sarif_file: snyk.sarif
