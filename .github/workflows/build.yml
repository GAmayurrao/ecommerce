name: CI Build and Package
on:
  push:
    branches:
      - growtharc
  pull_request:
    branches:
      - growtharc
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Run tests with Maven
        run: mvn clean verify --no-transfer-progress
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Build Spring Boot JAR
        run: mvn package -DskipTests --no-transfer-progress
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: springboot-jar
          path: target/*.jar
          retention-days: 7
  snyk-security:
    name: Snyk Security Scan
    runs-on: ubuntu-latest
    needs: build
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6
      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Pre-fetch dependencies so Snyk can resolve them
        run: mvn dependency:resolve --no-transfer-progress -q
        env:
          STRIPE_API_KEY: sk_test_dummy_key_for_ci
          STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci
      - name: Install Snyk CLI
        run: npm install -g snyk
      - name: Run Snyk vulnerability scan and write SARIF
        run: |
          snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk.sarif
          echo "Snyk exit code: $?"
          ls -lh snyk.sarif
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_CFG_ORG: ""
      - name: Create empty SARIF if Snyk did not produce one
        if: always()
        run: |
          if [ ! -f snyk.sarif ]; then
            echo "{\"version\":\"2.1.0\",\"runs\":[]}" > snyk.sarif
            echo "Created fallback empty SARIF"
          fi
      - name: Upload Snyk SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: snyk.sarif
